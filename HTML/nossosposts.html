<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nossos Posts • Rokuzen</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/recepcao.css">
</head>

<body>
  <div class="main shell">
    <header class="head">
      <a href="recepcao.html" class="btn btn-muted" style="margin-right:12px;"><i class="fa-solid fa-arrow-left"></i>
        Voltar</a>
      <h1>Nossos Posts — Administração</h1>
    </header>

    <section class="card" style="max-width:900px;margin:20px auto;">
      <h2>Publicar novidade</h2>
      <form id="postForm">
        <label>Título<br><input id="postTitle" required placeholder="Título do post" style="width:100%"></label><br><br>
        <label>Imagem (URL)<br><input id="postImage" placeholder="https://...jpg" style="width:100%"></label><br><br>
        <label>Trecho / Resumo<br><textarea id="postExcerpt" rows="4" style="width:100%"></textarea></label><br>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button type="submit" class="btn btn-primary">Publicar</button>
          <button type="button" id="clearPosts" class="btn btn-muted">Limpar tudo</button>
        </div>
        <div id="postMsg" style="margin-top:8px;color:var(--green)"></div>
      </form>
    </section>

    <section class="card" style="max-width:1000px;margin:16px auto;">
      <h2>Postagens atuais</h2>
      <div id="postsList" style="display:flex;flex-direction:column;gap:12px;"></div>
    </section>
  </div>

  <script>
    (function () {
      const postsKey = 'rokuzen_posts';
      const form = document.getElementById('postForm');
      const titleEl = document.getElementById('postTitle');
      const imgEl = document.getElementById('postImage');
      const excerptEl = document.getElementById('postExcerpt');
      const msg = document.getElementById('postMsg');
      const list = document.getElementById('postsList');
      const clearBtn = document.getElementById('clearPosts');

      function load() {
        const posts = JSON.parse(localStorage.getItem(postsKey) || '[]');
        renderList(posts);
      }

      function renderList(posts) {
        list.innerHTML = '';
        if (!posts.length) {
          list.innerHTML = '<div class="small">Nenhuma postagem.</div>';
          return;
        }
        posts.forEach(p => {
          const el = document.createElement('div');
          el.className = 'post';
          el.style.display = 'flex';
          el.style.alignItems = 'center';
          el.style.gap = '12px';
          el.innerHTML = `
            ${p.image ? `<img src="${p.image}" alt="${p.title}" style="width:96px;height:64px;object-fit:cover;border-radius:6px;">` : ''}
            <div style="flex:1">
              <strong>${p.title}</strong><br>
              <small style="color:#666">${new Date(p.created).toLocaleString()}</small>
              <div style="color:#444">${p.excerpt || ''}</div>
            </div>
            <div>
              <button data-id="${p.id}" class="btn btn-muted btn-delete">Excluir</button>
            </div>
          `;
          list.appendChild(el);
        });

        // attach delete handlers
        list.querySelectorAll('.btn-delete').forEach(b => {
          b.addEventListener('click', () => {
            const id = Number(b.getAttribute('data-id'));
            const posts = JSON.parse(localStorage.getItem(postsKey) || '[]').filter(x => x.id !== id);
            localStorage.setItem(postsKey, JSON.stringify(posts));
            load();
          });
        });
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const title = titleEl.value.trim();
        if (!title) return;
        const posts = JSON.parse(localStorage.getItem(postsKey) || '[]');
        posts.unshift({
          id: Date.now(),
          title,
          image: imgEl.value.trim(),
          excerpt: excerptEl.value.trim(),
          created: new Date().toISOString()
        });
        localStorage.setItem(postsKey, JSON.stringify(posts));
        msg.textContent = 'Post salvo com sucesso.';
        form.reset();
        load();
        setTimeout(() => msg.textContent = '', 2500);
      });

      clearBtn.addEventListener('click', () => {
        if (!confirm('Remover todas as postagens?')) return;
        localStorage.removeItem(postsKey);
        load();
      });

      load();
    })();
  </script>
  <!-- VLibras - Acessibilidade em Libras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

</body>

</html>
