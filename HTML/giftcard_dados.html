<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dados | ROKUZEN</title>

    <!-- Fontes -->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS externo -->
    <link rel="stylesheet" href="../CSS/giftcard_dados.css">

</head>

<body>
    <!-- Cabeçalho -->
    <div id="menu"></div>

    <!-- Seção principal -->
    <section class="dados-container">
        <h2>3. Dados:</h2>

        <form class="form-dados" autocomplete="on">
            <!-- Linha 1 -->
            <div class="linha">
                <div class="campo">
                    <label for="seu-nome">Seu nome</label>
                    <input type="text" id="seu-nome" name="seu-nome" placeholder="Digite seu nome" required>
                </div>

                <div class="campo">
                    <label for="nome-presenteado">Nome do presenteado</label>
                    <input type="text" id="nome-presenteado" name="nome-presenteado"
                        placeholder="Digite o nome do presenteado" required>
                </div>
            </div>

            <!-- Linha 2 -->
            <div class="linha">
                <div class="campo">
                    <label for="seu-email">Seu e-mail</label>
                    <input type="email" id="seu-email" name="seu-email" placeholder="Digite um e-mail válido" required>
                    <small>*O Gift Card será enviado para esse e-mail</small>
                </div>

                <div class="campo">
                    <label for="email-presenteado">E-mail do presenteado</label>
                    <input type="email" id="email-presenteado" name="email-presenteado"
                        placeholder="Digite um e-mail válido" required>
                    <small>*O Gift Card será enviado para esse e-mail</small>
                </div>
            </div>

            <!-- Linha 3 -->
            <div class="linha">
                <div class="campo">
                    <label for="celular">Seu DDD + Celular</label>
                    <div class="telefone">
                        <input type="tel" id="ddd" name="ddd" maxlength="2" placeholder="DDD" pattern="\d{2}" required>
                        <input type="tel" id="celular" name="celular" maxlength="9" placeholder="Celular"
                            pattern="\d{9}" required>
                    </div>
                </div>

                <div class="campo vazio"></div>
            </div>

            <!-- Botão -->
            <div class="botao-container">
                <button type="submit" class="btn-comprar">Comprar</button>
            </div>
        </form>

        <!-- Dots -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot active"></div>
        </div>
    </section>

    <footer>
        <div id="rodape"></div>
        <script>
            fetch("menu.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("menu").innerHTML = data;
                });

            fetch("rodape.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("rodape").innerHTML = data;
                });
        </script>
    </footer>

</body>

</html>
