<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/agendamento_unidades.css">
    <title>Agendamento | ROKUZEN</title>

</head>

<body>
    <header id="menu"></header>

    <main class="wrap">
        <h1>Agende sua sessão agora mesmo!</h1>

        <section class="titulo-agendamento">
            <h2>1. Selecione a unidade:</h2>
        </section>

        <section class="grid">
            <!-- São Bernardo -->
            <article class="unit">
                <button class="card" type="button" data-unit="sbc" data-name="São Bernardo do Campo"
                    data-mall="Golden Square Shopping">
                    <img src="../imagens/goldensquare.png" alt="Unidade São Bernardo do Campo">
                    <div class="ribbon">
                        <strong>Golden Square Shopping</strong>
                    </div>
                </button>
                <div class="city">São Bernardo do Campo</div>
            </article>

            <!-- Santo André -->
            <article class="unit">
                <button class="card" type="button" data-unit="sa" data-name="Santo André"
                    data-mall="Grand Plaza Shopping">
                    <img src="../imagens/grandplaza.png" alt="Unidade Santo André">
                    <div class="ribbon">
                        <strong>Grand Plaza Shopping</strong>
                    </div>
                </button>
                <div class="city">Santo André</div>
            </article>

            <!-- Água Branca -->
            <article class="unit">
                <button class="card" type="button" data-unit="ab" data-name="São Paulo - Água Branca"
                    data-mall="Shopping West Plaza">
                    <img src="../imagens/westplaza.png" alt="Unidade Água Branca">
                    <div class="ribbon">
                        <strong>Shopping West Plaza</strong>
                    </div>
                </button>
                <div class="city">São Paulo - Água Branca</div>
            </article>

            <!-- Mooca -->
            <article class="unit">
                <button class="card" type="button" data-unit="mooca" data-name="São Paulo - Mooca"
                    data-mall="Mooca Plaza Shopping">
                    <img src="../imagens/mooca.png" alt="Unidade Mooca">
                    <div class="ribbon">
                        <strong>Mooca Plaza Shopping</strong>
                    </div>
                </button>
                <div class="city">São Paulo - Mooca</div>
            </article>
        </section>

        <div class="dots">
            <div class="dot active" data-step="1"></div>
            <div class="dot" data-step="2"></div>
            <div class="dot" data-step="3"></div>
            <div class="dot" data-step="4"></div>
            <div class="dot" data-step="5"></div>
            <div class="dot" data-step="6"></div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dots = document.querySelectorAll(".dot");

            dots.forEach((dot) => {
                dot.addEventListener("click", () => {
                    // muda o estado visual
                    dots.forEach(d => d.classList.remove("active"));
                    dot.classList.add("active");

                    // redireciona para a etapa correspondente
                    const etapa = dot.dataset.step;
                    if (etapa === "1") window.location.href = "agendamento_unidades.html";
                    if (etapa === "2") window.location.href = "agendamento_serviços.html";
                    if (etapa === "3") window.location.href = "#";
                    if (etapa === "4") window.location.href = "agendamento_condicoes_med.html";
                    if (etapa === "5") window.location.href = "selecionar_data.html";
                    if (etapa === "6") window.location.href = "agendamento_dados.html";
                });
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cards = document.querySelectorAll(".card");

            cards.forEach(card => {
                card.addEventListener("click", () => {
                    // Remove a seleção dos outros cards
                    cards.forEach(c => c.classList.remove("selected"));

                    // Adiciona a seleção no card clicado
                    card.classList.add("selected");

                    // Redireciona direto para a página desejada
                    if (card.dataset.unit === "sbc") window.location.href = "agendamento_serviços.html";
                    else if (card.dataset.unit === "sa") window.location.href = "agendamento_serviços.html";
                    else if (card.dataset.unit === "ab") window.location.href = "agendamento_serviços.html";
                    else if (card.dataset.unit === "mooca") window.location.href = "agendamento_serviços.html";
                });
            });
        });
    </script>

    <!-- VLibras - Acessibilidade em Libras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <!-- carrega menu e rodapé -->
    <script>
        fetch("menu.html")
            .then(r => r.text())
            .then(html => { document.getElementById("menu").innerHTML = html; });

        fetch("rodape.html")
            .then(r => r.text())
            .then(html => { document.getElementById("rodape").innerHTML = html; });
    </script>

    <footer id="footerbar" class="mt-5 border-top">
        <div id="rodape"></div>
    </footer>
    <script src="https://app.embed.im/accessibility.js" defer></script>
</body>

</html>
