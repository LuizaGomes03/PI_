<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rokuzen — Dados do Agendamento</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&family=Amatic+SC:wght@700&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">

  <!-- Seu CSS (opcional) -->
  <link rel="stylesheet" href="../CSS/agendamento_dados.css" />

</head>

<body>
  <!-- MENU -->
  <header id="topbar" class="sticky-top bg-white shadow-sm">
    <div id="menu"></div>
  </header>

  <section class="titulo-agendamento">
    <h2>6. Preencha seus dados:</h2>
  </section>

  <main class="container py-4 page-section">
    <div class="rk-card">
      <!-- Formulário de Dados -->
      <form id="formDados" class="needs-validation" novalidate>
        <div class="rk-grid">
          <!-- Nome -->
          <div class="rk-field">
            <label for="nome">Nome completo</label>
            <input id="nome" name="nome" type="text" placeholder="Digite seu nome completo" required
              autocomplete="name" />
          </div>

          <!-- Email -->
          <div class="rk-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="Digite um e-mail válido" required
              autocomplete="email" inputmode="email" />
            <small class="rk-hint">*Se for cliente, utilize o e-mail de cadastro</small>
          </div>

          <!-- Celular: DDD + número -->
          <div class="rk-field rk-phone">
            <label for="ddd">Celular</label>
            <div class="rk-phone-row">
              <input id="ddd" name="ddd" type="text" placeholder="DDD" inputmode="numeric" maxlength="2" required />
              <input id="celular" name="celular" type="tel" placeholder="Digite o seu número de celular" inputmode="tel"
                required />
            </div>
          </div>
        </div>
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot "></div>
          <div class="dot active"></div>
        </div>

        <button class="rk-btn" type="submit">CONFIRMAR AGENDAMENTO</button>
        <small class="rk-footnote">
          Após clicar em “Confirmar Agendamento”, verifique seu e-mail cadastrado e finalize pelo link enviado.
          <p>Ao clicar, você concorda com a <a href="../HTML/termos_uso.html" target="_blank">Política de
              Privacidade</a> e os <a href="../HTML/termosservico.html" target="_blank">Termos de Serviço</a>.</p>
        </small>
      </form>
    </div>
    </section>

  </main>

  <!-- RODAPÉ -->
  <footer id="footerbar" class="mt-5 border-top">
    <div id="rodape"></div>
  </footer>

  <!-- JS: Bootstrap + Includes + Validação -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"></script>
  <script>
    // inclui menu e rodapé (ajuste os caminhos se menu.html/rodape.html estiverem em outra pasta)
    fetch("menu.html").then(r => r.text()).then(html => { document.getElementById("menu").innerHTML = html; });
    fetch("rodape.html").then(r => r.text()).then(html => { document.getElementById("rodape").innerHTML = html; });

    // validação Bootstrap vibe
    const form = document.getElementById('formDados');
    form.addEventListener('submit', (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
      }
      form.classList.add('was-validated');
    }, false);


  </script>
  <!-- VLibras - Acessibilidade em Libras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>


</body>

</html>
