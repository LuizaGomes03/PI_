<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/agendamento.css">
    <title>Agendamento | ROKUZEN</title>
    <style>
        /* botão */
        .rk-btn {
            display: inline-block;
            width: 100%;
            background-color: #7D9950;
            color: white;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 14px;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .rk-btn:hover {
            background-color: #6f8747;
            transform: translateY(-1px);
        }

        /* destaque da unidade selecionada */
        .card.selected {
            outline: 3px solid #7D9950;
            transform: scale(1.03);
            transition: all 0.2s ease;
        }
    </style>
</head>

<body>
    <header id="menu"></header>

    <main class="wrap">
        <h2 class="page-title">AGENDE SUA SESSÃO AGORA MESMO!</h2>
        <ol class="steps">
            <li>Selecione a unidade</li>
        </ol>

        <section class="grid">
            <!-- São Bernardo -->
            <article class="unit">
                <button class="card" type="button" data-unit="sbc" data-name="São Bernardo do Campo"
                    data-mall="Golden Square Shopping">
                    <img src="https://rokuzen.com.br/atendentes/fachada_golden.jpg" alt="Unidade São Bernardo do Campo">
                    <div class="ribbon">
                        <strong>Golden Square Shopping</strong>
                        <small>Piso L1</small>
                    </div>
                </button>
                <div class="city">São Bernardo do Campo</div>
            </article>

            <!-- Santo André -->
            <article class="unit">
                <button class="card" type="button" data-unit="sa" data-name="Santo André"
                    data-mall="Grand Plaza Shopping">
                    <img src="https://rokuzen.com.br/wp-content/uploads/2023/08/fachada_gps2@2x.jpg"
                        alt="Unidade Santo André">
                    <div class="ribbon">
                        <strong>Grand Plaza Shopping</strong>
                        <small>Piso Térreo</small>
                    </div>
                </button>
                <div class="city">Santo André</div>
            </article>

            <!-- Água Branca -->
            <article class="unit">
                <button class="card" type="button" data-unit="ab" data-name="São Paulo - Água Branca"
                    data-mall="Shopping West Plaza">
                    <img src="https://rokuzen.com.br/agendamento/west3.jpg" alt="Unidade Água Branca">
                    <div class="ribbon">
                        <strong>Shopping West Plaza</strong>
                        <small>2º Piso</small>
                    </div>
                </button>
                <div class="city">São Paulo - Água Branca</div>
            </article>

            <!-- Mooca -->
            <article class="unit">
                <button class="card" type="button" data-unit="mooca" data-name="São Paulo - Mooca"
                    data-mall="Mooca Plaza Shopping">
                    <img src="https://rokuzen.com.br/atendentes/fachada_mooca.jpg" alt="Unidade Mooca">
                    <div class="ribbon">
                        <strong>Mooca Plaza Shopping</strong>
                        <small>Piso Térreo</small>
                    </div>
                </button>
                <div class="city">São Paulo - Mooca</div>
            </article>
        </section>

        <button class="rk-btn" id="confirmarBtn">CONFIRMAR</button>

        <div class="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </main>

    <footer>
        <div id="rodape"></div>
        <script>
            fetch("menu.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("menu").innerHTML = data;
                });

            fetch("rodape.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("rodape").innerHTML = data;
                });
        </script>
    </footer>

    <!-- ===== JS: seleção + redirecionamento ===== -->
    <script>
        (function () {
            const cards = document.querySelectorAll('.card');
            const confirmarBtn = document.getElementById('confirmarBtn');

            function clearSelected() {
                cards.forEach(c => c.classList.remove('selected'));
            }

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    clearSelected();
                    card.classList.add('selected');
                });
            });

            confirmarBtn.addEventListener('click', () => {
                const selecionado = document.querySelector('.card.selected');
                if (selecionado) {
                    // redireciona apenas se houver seleção
                    window.location.href = "agendamento_opção2.html";
                } else {
                    alert("Por favor, selecione uma unidade antes de confirmar.");
                }
            });
        })();
    </script>

</body>

</html>
