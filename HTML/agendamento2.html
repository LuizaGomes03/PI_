<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/agendamento.css">
    <title>Selecione o Serviço | ROKUZEN</title>
</head>

<body>
    <header id="menu"></header>

    <!-- ====== CONTEÚDO AGENDAMENTO ====== -->
    <main class="wrap">
        <h2 class="page-title">SELECIONE O SERVIÇO DESEJADO</h2>
        <ol class="steps">
            <li>Selecione a unidade</li>
            <li class="active">Selecione o serviço</li>
        </ol>

        <section class="grid">
            <!-- Massagem Terapêutica -->
            <article class="service">
                <div class="card" data-service="massagem-terapeutica" data-name="Massagem Terapêutica">
                    <h3>Massagem Terapêutica</h3>
                    <p>Alívio de tensões musculares e relaxamento profundo.</p>
                </div>
            </article>

            <!-- Shiatsu -->
            <article class="service">
                <div class="card" data-service="shiatsu" data-name="Shiatsu">
                    <h3>Shiatsu</h3>
                    <p>Equilíbrio energético e bem-estar.</p>
                </div>
            </article>

            <!-- Liberação Miofascial -->
            <article class="service">
                <div class="card" data-service="liberacao-miofascial" data-name="Liberação Miofascial">
                    <h3>Liberação Miofascial</h3>
                    <p>Tratamento para dores crônicas e mobilidade.</p>
                </div>
            </article>
        </section>

        <!-- paginação bolinhas -->
        <ul class="dots" aria-label="Paginação">
            <li class="dot active" aria-current="true"></li>
            <li class="dot"></li>
        </ul>
    </main>

    <footer>
        <div id="rodape"></div>
    </footer>

    <!-- JS externo -->
    <script src="../JS/agendamento.js"></script>
</body>

</html>
