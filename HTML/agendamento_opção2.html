<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento</title>

  <!-- Fontes -->
  <link
    href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Raleway:wght@300;400;600&display=swap"
    rel="stylesheet">

  <!-- CSS externo -->
  <link rel="stylesheet" href="../CSS/agendamento_opção2.css">


</head>

<body>
  <div id="menu"></div>

  <!-- ====== Título ====== -->
  <section class="titulo-agendamento">
    <h2>2. Escolha o serviço de sua preferência e reserve seu horário</h2>
  </section>

  <!-- ====== Serviços ====== -->
  <section class="servicos-section">

    <div class="servico" data-url="agendamento_tempo_quick.html">
      <img src="https://itiomassagem.com.br/midia/terapias/itio-rokuzen-quick-2.jpg" alt="Quick Massage">
      <h3>Quick Massage</h3>
    </div>

    <div class="servico" data-url="agendamento_tempo_maca.html">
      <img src="https://rokuzen.com.br/compragift/v_maca.jpg" alt="Maca">
      <h3>Maca</h3>
      <p>(Shiatsu / Armá / Ventosa / Relaxante)</p>
    </div>

    <div class="servico" data-url="agendamento_tempo_reflexologia.html">
      <img src="https://rokuzen.com.br/eventos/assets/img/product-screen-1.png" alt="Reflexologia Podal">
      <h3>Reflexologia Podal</h3>
    </div>

    <div class="servico" data-url="agendamento_tempo_auriculoterapia.html">
      <img src="https://rokuzen.com.br/eventos/assets/img/product-screen-2.png" alt="Auriculoterapia">
      <h3>Auriculoterapia</h3>
    </div>
  </section>

  <!-- ====== Dots ====== -->
  <div class="dots">
    <div class="dot"></div>
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <!-- ====== Botão confirmar ====== -->
  <button class="rk-btn" id="confirmarBtn">CONFIRMAR</button>

  <!-- ====== JS: seleção + redirecionamento ====== -->
  <script>
    (function () {
      const servicos = document.querySelectorAll('.servico');
      const confirmarBtn = document.getElementById('confirmarBtn');

      function clearSelected() {
        servicos.forEach(s => s.classList.remove('selected'));
      }

      servicos.forEach(servico => {
        servico.addEventListener('click', () => {
          clearSelected();
          servico.classList.add('selected');
        });
      });

      confirmarBtn.addEventListener('click', () => {
        const selecionado = document.querySelector('.servico.selected');
        if (selecionado) {
          const destino = selecionado.getAttribute('data-url');
          window.location.href = destino;
        } else {
          alert("Por favor, selecione um serviço antes de confirmar.");
        }
      });
    })();
  </script>
  <!-- VLibras - Acessibilidade em Libras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <footer>
    <div id="rodape"></div>
    <script>
      fetch("menu.html")
        .then(r => r.text())
        .then(d => document.getElementById("menu").innerHTML = d);

      fetch("rodape.html")
        .then(r => r.text())
        .then(d => document.getElementById("rodape").innerHTML = d);
    </script>
  </footer>
</body>

</html>
