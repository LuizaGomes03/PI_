<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Massage | ROKUZEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/tempo_quick.css">

</head>

<body>
    <!-- ===== Menu ===== -->
    <div id="menu"></div>

    <main class="massage-section">
        <h2>2. Selecione o tempo da Quick Massage:</h2>

        <!-- grid 3 cards centralizados -->
        <div class="reflex-grid">
            <div class="massage-card" role="button" tabindex="0" data-value="20">
                <div class="time">🕒 15 minutos</div>
                <div class="price">R$ 52,00</div>
            </div>

            <div class="massage-card" role="button" tabindex="0" data-value="30">
                <div class="time">🕒 25 minutos</div>
                <div class="price">R$ 73,00</div>
            </div>

            <div class="massage-card" role="button" tabindex="0" data-value="40">
                <div class="time">🕒 35 minutos</div>
                <div class="price">R$ 92,00</div>
            </div>
        </div>

        <!-- dots -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot active"></div>
            <div class="dot"></div>
        </div>
    </main>

    <footer>
        <div id="rodape"></div>
        <script>
            fetch("menu.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("menu").innerHTML = data;
                });

            fetch("rodape.html")
                .then((response) => response.text())
                .then((data) => {
                    document.getElementById("rodape").innerHTML = data;
                });
        </script>
    </footer>
    <!-- ===== JS: seleção única + acessibilidade ===== -->
    <script>
        (function () {
            const cards = document.querySelectorAll('.massage-card');

            function clearSelected() {
                cards.forEach(c => c.classList.remove('selected'));
            }

            cards.forEach(card => {
                // clique com mouse
                card.addEventListener('click', () => {
                    clearSelected();
                    card.classList.add('selected');
                });

                // teclado: Enter ou Espaço
                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        clearSelected();
                        card.classList.add('selected');
                    }
                });
            });
        })();
    </script>
    <!-- VLibras - Acessibilidade em Libras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://app.embed.im/accessibility.js" defer></script>

</body>

</html>
