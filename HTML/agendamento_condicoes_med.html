<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rokuzen — Condições de Saúde</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/agendamento_condicoes_med.css" />
</head>

<body>
  <header id="topbar" class="sticky-top bg-white shadow-sm">
    <div id="menu"></div>
  </header>
  <section class="titulo-agendamento">
    <h2>4. Condições de saúde importantes:</h2>
  </section>
  <main class="container py-4 page-section">
    <section class="rk-card condicoes">
      <p class="rk-desc">Para garantir sua segurança, marque as opções que se aplicam a você:</p>

      <div class="grupo">
        <h3>Condições Médicas</h3>
        <div class="chips">
          <label><input type="checkbox" value="Gravidez"><span>Gravidez</span></label>
          <label><input type="checkbox" value="Trombose"><span>Trombose</span></label>
          <label><input type="checkbox" value="Gripe"><span>Gripe</span></label>
          <label><input type="checkbox" value="Câncer"><span>Câncer</span></label>
          <label><input type="checkbox" value="Alterações de pressão arterial"><span>Alterações de pressão
              arterial</span></label>
        </div>
      </div>

      <div class="grupo">
        <h3>Alergias</h3>
        <div class="chips">
          <label><input type="checkbox" value="Alergia a óleos corporais ou cremes"><span>Alergia a óleos corporais ou
              cremes</span></label>
        </div>
      </div>

      <div class="grupo">
        <h3>Histórico de Saúde</h3>
        <div class="chips">
          <label><input type="checkbox" value="Fraturas, hérnias, osteoporose ou osteopenia"><span>Fraturas, hérnias,
              osteoporose ou osteopenia</span></label>
          <label><input type="checkbox" value="Cirurgias recentes"><span>Cirurgias recentes</span></label>
        </div>
      </div>

      <div class="grupo">
        <h3>Outros</h3>
        <div class="chips">
          <label><input type="checkbox" value="Nenhuma das opções acima"><span>Nenhuma das opções acima</span></label>
        </div>
      </div>

      <button class="rk-btn" id="confirmarBtn">CONFIRMAR</button>

      <div class="progress-dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </section>
  </main>

  <footer id="footerbar" class="mt-5 border-top">
    <div id="rodape"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const chips = document.querySelectorAll(".chips label");
      const confirmarBtn = document.getElementById("confirmarBtn");
      let nenhumaOpcao = document.querySelector('.chips input[value="Nenhuma das opções acima"]');
      if (!nenhumaOpcao) {
        nenhumaOpcao = Array.from(document.querySelectorAll('.chips input')).find(i => i.value && i.value.toLowerCase().includes('nenhuma'));
      }

      chips.forEach(chip => {
        const input = chip.querySelector("input");
        const span = chip.querySelector("span");
        if (!input || !span) return;
        input.addEventListener("change", () => {
          if (nenhumaOpcao && input === nenhumaOpcao && input.checked) {
            document.querySelectorAll('.chips input').forEach(outro => {
              if (outro === nenhumaOpcao) return;
              outro.checked = false;
              const s = outro.closest('label') ? outro.closest('label').querySelector('span') : outro.nextElementSibling;
              if (s) {
                s.style.backgroundColor = "#e6edd7";
                s.style.color = "#222";
              }
            });
          }
          if (nenhumaOpcao && input !== nenhumaOpcao && input.checked) {
            nenhumaOpcao.checked = false;
            const sNenhuma = nenhumaOpcao.closest('label') ? nenhumaOpcao.closest('label').querySelector('span') : nenhumaOpcao.nextElementSibling;
            if (sNenhuma) {
              sNenhuma.style.backgroundColor = "#e6edd7";
              sNenhuma.style.color = "#222";
            }
          }
          if (input.checked) {
            span.style.backgroundColor = "#9DB668";
            span.style.color = "#fff";
          } else {
            span.style.backgroundColor = "#e6edd7";
            span.style.color = "#222";
          }
        });
      });

      confirmarBtn.addEventListener("click", () => {
        const selecionados = Array.from(document.querySelectorAll(".chips input:checked"))
          .map(input => input.value.trim())
          .filter(v => v.length > 0);
        if (selecionados.length === 0) {
          alert("Por favor, selecione ao menos uma condição ou marque 'Nenhuma das opções acima'.");
          return;
        }
        localStorage.setItem("condicoesSelecionadas", JSON.stringify(selecionados));
        confirmarBtn.disabled = true;
        confirmarBtn.textContent = "Aguarde...";
        setTimeout(() => {
          window.location.href = "selecionar_data.html";
        }, 500);
      });
    });

    fetch("menu.html").then(r => r.text()).then(html => { document.getElementById("menu").innerHTML = html; });
    fetch("rodape.html").then(r => r.text()).then(html => { document.getElementById("rodape").innerHTML = html; });
  </script>

  <!-- VLibras - Acessibilidade em Libras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>
  <script src="https://app.embed.im/accessibility.js" defer></script>
</body>

</html>
