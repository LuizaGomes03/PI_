<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rokuzen Funcionários</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="../video\13294237-hd_1920_1080_25fps.mp4" type="video/mp4">
    </video>

    <div class="login-box">

        <a href="homepage.html" class="logo-link">
            <img src="../imagens/logo.png" alt="Logo Rokuzen" class="logo">
        </a>

        <h1>Área Restrita</h1>
        <p>Login exclusivo para funcionários Rokuzen</p>

        <form id="login-form">
            <div class="input-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="user" required>
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>

                <div class="senha-wrapper">
                    <input type="password" id="senha" name="password" required>
                    <i id="toggleSenha" class="fa-solid fa-eye"></i>
                </div>
            </div>



            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="notice"><i class="fa-solid fa-lock"></i> Acesso restrito a colaboradores autorizados.</p>
    </div>

    <footer>© 2025 Rokuzen – Trabalho Acadêmico</footer>

    <!-- VLibras - Acessibilidade em Libras -->
    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script src="https://app.embed.im/accessibility.js" defer></script>
    <script src="../JS/login.js" defer></script>
</body>

</html>
