<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rokuzen Funcionários</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <!-- 🌿 Fundo com vídeo -->
    <video id="bg-video" autoplay muted loop playsinline>
        <source src="../video/3140104-hd_1920_1080_30fps.mp4" type="video/mp4">
       
    </video>

    <div class="login-box">


        <a href="homepage.html" class="logo-link">
            <img src="../imagens/logo.png" alt="Logo Rokuzen" class="logo">
        </a>

        <h1>Área Restrita</h1>
        <p>Login exclusivo para funcionários Rokuzen</p>

        <form onsubmit="return loginFuncionario(event)">
            <div class="input-group">
                <label for="user">Usuário</label>
                <input type="text" id="user" name="user" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <p class="notice"><i class="fa-solid fa-lock"></i> Acesso restrito a colaboradores autorizados.</p>
    </div>

    <footer>© 2025 Rokuzen – Trabalho Acadêmico</footer>

    <script>
        function loginFuncionario(e) {
            e.preventDefault();

            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "funcionario" && pass === "rokuzen123") {
                alert("Bem-vindo, colaborador Rokuzen 🌿");
                window.location.href = "recepcao.html";
            } else {
                alert("Usuário ou senha incorretos!");
            }
        }
    </script>
